[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "falsehit"
version = "0.1.0"
description = "A FastAPI semantic cache for LLM calls whose match threshold is fitted on labelled near-miss pairs, with guards, so the false-hit rate is bounded for pairs drawn like the calibration set."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "falsehit contributors" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "numpy>=1.26",
  "scipy>=1.11",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "typer>=0.12",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
falsehit = "falsehit.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/falsehit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["live: calls a real upstream; needs FALSEHIT_LIVE=1"]
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/falsehit/cli.py" = ["B008"]
